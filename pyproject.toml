[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encoreplay"
version = "0.1.0"
description = "EncorePlay backend: Fountain script parser and rehearsal API for the theatre practice platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "screenplain>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["EncorePlay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

